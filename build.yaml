# One repo, two keyboards. Each push builds firmware for both.
---
include:
  # Typeractive Corne (classic 42-key, nice!nano v2)
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    artifact-name: Typeractive-Corne-left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    artifact-name: Typeractive-Corne-right

  # Alibaba Corne (Eyelash, with joystick + knob)
  - board: eyelash_corne_left
    shield: nice_view
    artifact-name: Alibaba-Corne-left
  - board: eyelash_corne_right
    shield: nice_view
    artifact-name: Alibaba-Corne-right

  # Works for both (flash to each half to wipe pairings)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
