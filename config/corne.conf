# Classic Corne (nice!nano v2)

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

CONFIG_ZMK_KEYBOARD_NAME="Corne Ale"
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep after 30 minutes idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth: let a known host (e.g. the Mac) re-pair over its old pairing
# instead of being rejected after it drops out of range. Also turns off 2M PHY.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Keep pairing simple: no passkey typing on the keyboard
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
